<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/cadastro.js" defer></script>
    <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <form action="../php/cadastro.php" method="post" onsubmit="checarSenha(event)">
        <h1>Cadastro</h1>

        <div class="dados">
            <div class="dado">
                <img src="../images/usuario.png" alt="imagem do usuário">
                <input type="text" name="txtUsuario" placeholder="Usuário" required>
            </div>
            <div class="dado">
                <img src="../images/carta.png" alt="imagem de uma carta">
                <input type="email" name="txtEmail" placeholder="Email" required>
            </div>
            <div class="dado">
                <img src="../images/cadeado.png" alt="imagem de um cadeado">
                <input type="password" name="txtSenha" id="senha" placeholder="Senha" required>
                <button type="button" class="revelar-senha">
                    <img src="../images/olho-fechado.png" id="imagem-senha" alt="imagem de um olho">
                </button>
            </div>
            <div class="dado">
                <img src="../images/cadeado.png" alt="imagem de um cadeado">
                <input type="password" id="repetir-senha" placeholder="Repetir Senha" required>
                <button type="button" class="revelar-senha">
                    <img src="../images/olho-fechado.png" id="imagem-senha" alt="imagem de um olho">
                </button>
            </div>
        </div>

        <button class="btn-cadastro">Cadastrar</button>

        <div class="link">
            <a href="login.html">Login</a>
        </div>
    </form>
</body>
</html>
